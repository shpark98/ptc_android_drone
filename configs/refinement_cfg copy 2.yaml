segmentation:
  edge_method: sobel
  canny_thresh: [0, 30]
  seg_method: felzenszwalb
  seg_params:
    sigma: 0.0
    scale: 700
    min_size: 50
  use_rgb: true
  wrgb: 1.5
  wgrad: 1.0
  wx: 1.0
  grad_power: 0.7
  seg_down: 0.3

motion_field:
  min_points: 100
  ransac_max_iters: 500
  ransac_min_sample: 7
  ransac_thresh_ratio: 0.1
  ransac_thr_min: 0.0001
  ransac_thr_max: 0.3
  inlier_target_min: 0.25
  inlier_target_max: 0.7
  shrink_factor: 0.8
  grow_factor: 1.2
  max_shrink_steps: 15

  lo_irls_iters: 4
  huber_delta: 0.5
  
  use_angle_gate: true
  ang_min_flow_px: 0.1
  ang_thr_mode: 'mad' # 'fixed' or 'mad'
  ang_mad_k: 0.5
  ang_thr_deg_fix: 15

  min_cond_ratio: 1.0e-5
  mad_scale: 3.5
  res_thresh: 0.5

  depth_bins: 5
  min_flow_px: 0.1 # 최소 움직임 0.5픽셀
  margin_x_pct: 0.05 # 좌우 5%
  margin_y_pct: 0.2 # 상하 5%
  show_angle_bins: true

refinement:
  debug: false

  use_baseline_guard: true
  min_baseline_for_correction: 0.01   # [m]
  max_points : 500
  rpx_variance:
    tau0: 5.0
    sigma2_at_tau: 1.0
    var_floor: 1.0e-3
    var_cap: 1.0e+3

  baseline_scaling:
    b_ref: 1.0         # [m]
    tau_gamma_b: 2.0
    tau_scale_min: 1.0e-3
    tau_scale_max: 10.0

  consistency:
    alpha: 0.5

  fusion:
    chi2_soft: 6.635
    chi2_hard: 10.828
    kcap_floor: 0.15
    trust_pow: 1.0
    kC_R: 1.8
    gate_loosen: 0.95
    min_var: 1.0e-3
    lambda_forget: 0.35
    q_base: 1.0e-3
    q_aggr: 3.0e-2
    eta_rel: 0.35
    k_m2_boost: 0.4

  irls_plane:
    huber_delta: 2.5
    iters: 5
    beta_cov: 1.0
    delta_spread: 1.0
    var_floor: 1.0e-3
    var_cap: 1.0e+3
    return_quality: false
    enable_steep_fallback: true
    use_neighbor_first: false
    grad_rel_thr: 0.01
    grad_abs_thr: .inf
    max_cond_log10: 6.0
    neighbor_min_score: 0.4
    enable_global_mad_filter: true
    global_trim_k: 2.5
    global_pct_clip: [0.5, 99.5]

  gating:
    rpx_mad_mul: 2.5          # tau_gate = 1.4826*MAD * rpx_mad_mul
    diff_mad_mul: 2.5         # kappa = 1.4826*MAD(diff) * diff_mad_mul
    agree_thresh: 0.6         # agree_mask 임계
